[workspace]
members = ["crates/trace-model", "crates/trace-hub"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jm-observer/trace-hub"

[workspace.dependencies]
# 共享契约（客户端与后端的单一事实源）
trace-model = { path = "crates/trace-model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
env_logger = "0.11"

[profile.release]
strip = true
lto = true
